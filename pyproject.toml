[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-portal"
version = "0.2.0"
description = "A small, extensible FastMCP server scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "ddgs>=9.0,<10",
    "fastmcp>=3.0.0,<5",
    "httpx>=0.28,<1",
    "langchain-community>=0.4.1,<1",
    "langchain-mongodb>=0.11,<1",
    "langchain>=1.3.2,<2",
    "langgraph>=1.2.2,<2",
    "ldap3>=2.9.1,<3",
    "markdownify>=1.1,<2",
    "mcp[cli]>=1.28.1,<3",
    "opentelemetry-api>=1.30,<2",
    "oracledb>=2.5,<5",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pypdf>=6.16,<7",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.0.1,<2",
    "sqlalchemy>=2.0.51,<3",
]

[project.optional-dependencies]
kerberos = [
    "pyspnego[kerberos]>=0.12,<1",
]
dev = [
    "black>=26.5.1",
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.16.4,<1",
]

[project.scripts]
mcp-portal = "mcp_portal.__main__:main"
mcp-portal-wiki = "mcp_portal.wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mcp_portal --cov-report=term --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["mcp_portal"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "C901",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "SIM",
    "RET",
    "PIE",
    "FURB",
    "RUF",
]

[tool.black]
line-length = 100
target-version = ["py311"]
