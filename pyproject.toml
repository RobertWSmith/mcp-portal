[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-portal"
version = "0.2.0"
description = "A small, extensible FastMCP server scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "ddgs>=9.16.0,<10",
    "fastmcp>=4.0.3,<5",
    "httpx>=0.28.1,<1",
    "langchain-community>=0.4.2,<1",
    "langchain-mongodb>=0.12.0,<1",
    "langchain>=1.4.0,<2",
    "langgraph>=1.2.11,<2",
    "ldap3>=2.9.1,<3",
    "markdownify>=1.2.3,<2",
    "mcp[cli]>=2.2.0,<3",
    "opentelemetry-api>=1.44.0,<2",
    "oracledb>=4.0.2,<5",
    "pgvector>=0.5.0,<1",
    "psycopg[binary]>=3.3.5,<4",
    "pydantic>=2.13.5,<3",
    "pypdf>=6.18.0,<7",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2.3,<2",
    "sqlalchemy>=2.0.52,<3",
]

[project.optional-dependencies]
kerberos = [
    "pyspnego[kerberos]>=0.12.2,<1",
]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.6,<1",
]

[project.scripts]
mcp-portal = "mcp_portal.__main__:main"
mcp-portal-wiki = "mcp_portal.wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mcp_portal --cov-report=term --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["mcp_portal"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "C901",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "SIM",
    "RET",
    "PIE",
    "FURB",
    "RUF",
]

[tool.black]
line-length = 100
target-version = ["py311"]
